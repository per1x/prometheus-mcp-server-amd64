name: build-amd64
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: prometheus-mcp-server:0.1.11-amd64
          outputs: type=docker,dest=prometheus-mcp-server-0.1.11-amd64.tar
      - run: gzip -9 prometheus-mcp-server-0.1.11-amd64.tar && ls -lh *.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-mcp-server-0.1.11-amd64
          path: prometheus-mcp-server-0.1.11-amd64.tar.gz
          compression-level: 0
          retention-days: 7
